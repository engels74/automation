name: Checked merge
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [synchronize, reopened, edited, ready_for_review]
  workflow_run:
    workflows: [ci]
    types: [completed]
permissions: {}
concurrency:
  group: checked-merge
  cancel-in-progress: false
jobs:
  merge:
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
      checks: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: ./actions/merge
        with:
          token: ${{ github.token }}
